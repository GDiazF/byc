{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByC - Iniciar Sesión</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- CSS personalizado para la página de login -->
    <link href="{% static 'css/login.css' %}" rel="stylesheet">
</head>
<body {% if form.errors %}data-has-errors="true"{% endif %}>
    <!-- Contenedor principal del formulario de login -->
    <div class="login-container">
        <div class="login-card">
            <!-- Encabezado con logo y título -->
            <div class="login-header">
                <img src="{% static 'img/logoGruas.png' %}" alt="Logo ByC">
                <h1>Iniciar Sesión</h1>
            </div>
            
            <!-- Formulario de login -->
            <div class="login-form-container">
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <!-- Campo de usuario -->
                    <div class="form-group">
                        <label for="id_username">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text" name="username" id="id_username" 
                                   class="form-control" placeholder="Ingrese su nombre de usuario" required>
                        </div>
                    </div>
                    <!-- Campo de contraseña -->
                    <div class="form-group">
                        <label for="id_password">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input type="password" name="password" id="id_password" 
                                   class="form-control" placeholder="Ingrese su contraseña" required>
                        </div>
                    </div>
                    <!-- Botón de envío -->
                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                    <!-- Enlace al admin -->
                    <div class="login-footer d-flex justify-content-center">
                        <a href="{% url 'admin:index' %}" class="admin-login">Ingreso Administrador</a>
                    </div>
                    <!-- Campo oculto para redirección después del login -->
                    <input type="hidden" name="next" value="{{ next }}">
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de Error: Se muestra cuando hay errores de autenticación -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">Error de Inicio de Sesión</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="errorMessage">
                        {% if form.errors %}
                        Usuario o contraseña incorrectos
                        {% endif %}
                    </p>
                </div>
                <div class="modal-footer justify-content-end">
                    <button type="button" class="btn btn-primary btn-sm px-3" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript personalizado para la página de login -->
    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
